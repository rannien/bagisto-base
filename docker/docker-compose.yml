services:
  nginx:
    hostname: nginx
    restart: unless-stopped
    build:
      context: ./images/nginx
      args:
        - APP_HOST=${APP_HOST}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    extra_hosts:
      - ${APP_HOST}:host-gateway
    volumes:
      - ${SRC_FROM_DOCKER_COMPOSE_FILE}:/webapp
    environment:
      - TZ=${APP_TIMEZONE}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-nginx.entrypoints=http"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-nginx.rule=Host(`${APP_HOST}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-nginx.loadbalancer.server.port=80"
    healthcheck:
      disable: true
      test: ["NONE"]
    depends_on:
      - database
      - php
    networks:
      - laravel_net
      - web

  php:
    build:
      context: ./images/php
      args:
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
    restart: always
    extra_hosts:
      - ${APP_HOST}:host-gateway
    depends_on:
      database:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV}
    labels:
      - "traefik.enable=false"
    volumes:
      - ${SRC_FROM_DOCKER_COMPOSE_FILE}:/webapp
    networks:
      - laravel_net
      - web

  database:
    hostname: database
    restart: unless-stopped
    image: mariadb:12.1.2
    environment:
      - TZ=${APP_TIMEZONE}
      - MYSQL_DATABASE=${COMPOSE_PROJECT_NAME}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    labels:
      - "traefik.enable=false"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3366:3306"
    networks:
      - laravel_net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    hostname: phpmyadmin
    restart: unless-stopped
    image: phpmyadmin/phpmyadmin:5.2.3
    environment:
      - PMA_HOST=database
      - TZ=${APP_TIMEZONE}
    labels:
      - "traefik.enable=true"
      - "traefik.port=80"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma.entrypoints=http"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma.rule=Host(`pma.${APP_DOMAIN}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-pma.loadbalancer.server.port=80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - laravel_net
      - web

  redis:
    hostname: redis
    restart: unless-stopped
    image: redis:8.4.0
    environment:
      - TZ=${APP_TIMEZONE}
    volumes:
      - redisdata:/var/lib/redis
    labels:
      - "traefik.enable=false"
    networks:
      - laravel_net

  redisinsight:
    hostname: redisinsight
    restart: unless-stopped
    image: redis/redisinsight:3.0.2
    environment:
      - TZ=${APP_TIMEZONE}
      - REDISINSIGHT_HOST=0.0.0.0
      - REDISINSIGHT_PORT=5540
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-redisinsight.entrypoints=http"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-redisinsight.rule=Host(`redis.${APP_DOMAIN}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-redisinsight.loadbalancer.server.port=5540"
    depends_on:
      - redis
    volumes:
      - redisinsightdata:/data
    networks:
      - laravel_net
      - web

volumes:
  mysqldata:
    driver: local
  redisdata:
    driver: local
  redisinsightdata:
    driver: local

networks:
  laravel_net:
    driver: bridge
  web:
    external: true
